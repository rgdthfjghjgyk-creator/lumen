workflows:
  ios-release:
    name: iOS Release Build
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Clean and prepare
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/Flutter/Flutter.xcframework
          rm -rf ~/Library/Developer/Xcode/DerivedData
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Generate iOS folder
        script: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios . --overwrite
          fi
          # Принудительно создаем схему Runner
          mkdir -p ios/Runner.xcodeproj/xcshareddata/xcschemes
      
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      
      - name: Build IPA
        script: |
          flutter build ipa --release --no-codesign
      
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com