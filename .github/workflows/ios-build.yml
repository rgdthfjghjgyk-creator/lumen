name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Disable Swift Package Manager and build
        run: |
          # Удаляем проблемные файлы
          rm -rf ios/Flutter/ephemeral/Packages
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          
          # Создаем Podfile без SwiftPM
          cat > ios/Podfile << 'EOF'
          platform :ios, '12.0'
          
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              end
            end
          end
          EOF
          
          # Устанавливаем поды
          cd ios
          pod install
          cd ..
          
          # Создаем недостающую папку
          mkdir -p ios/Flutter/ephemeral/Packages
          touch ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage.swift
          
          # Билдим
          flutter build ios --release --no-codesign
          
          # Создаем IPA
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lumen.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa