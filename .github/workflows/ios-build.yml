name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Build iOS
        run: |
          # Полная очистка
          flutter clean
          rm -rf ios
          rm -rf build
          
          # Получаем зависимости
          flutter pub get
          
          # Создаем iOS проект
          flutter create --platforms=ios --org=com.lumen .
          
          # НЕ создаем свой Podfile, используем тот, что создал Flutter
          # Просто добавляем platform в начало существующего Podfile
          sed -i '' '1s/^/platform :ios, '\''13.0'\''\n/' ios/Podfile
          
          # Устанавливаем поды
          cd ios
          pod install --repo-update
          cd ..
          
          # Билдим
          flutter build ios --release --no-codesign
          
          # Создаем IPA
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../lumen.ipa Payload/
          cd ../../..
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa