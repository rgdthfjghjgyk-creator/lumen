name: Build iOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # Ручная установка Flutter вместо subosito/flutter-action
      - name: Setup Flutter
        run: |
          # Скачиваем Flutter для macOS ARM64 напрямую
          FLUTTER_VERSION="3.19.6"
          FLUTTER_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          
          curl -L -o flutter.zip $FLUTTER_URL
          unzip -q flutter.zip
          echo "$(pwd)/flutter/bin" >> $GITHUB_PATH
          rm flutter.zip
          
          # Предварительно соглашаемся с лицензиями
          flutter --version
          flutter doctor
      
      - name: Install dependencies
        run: |
          flutter pub get
          flutter clean
      
      - name: Build .app (without signing)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lumen.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa