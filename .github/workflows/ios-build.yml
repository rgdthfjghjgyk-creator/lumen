name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      
      - name: Build
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --simulator
          mkdir Payload && cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r lumen.ipa Payload/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa