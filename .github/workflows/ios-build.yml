name: Build iOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      # Ручная установка Flutter
      - name: Setup Flutter
        run: |
          # Скачиваем Flutter
          curl -L -o flutter.zip https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.19.6-stable.zip
          unzip -q flutter.zip
          
          # Добавляем в PATH правильно
          echo "$(pwd)/flutter/bin" >> $GITHUB_PATH
          
          # Также добавляем в PATH для текущей сессии
          export PATH="$PATH:$(pwd)/flutter/bin"
          
          # Проверяем
          ls -la flutter/bin/
          ./flutter/bin/flutter --version
      
      - name: Install dependencies
        run: |
          # Используем полный путь к flutter
          ./flutter/bin/flutter pub get
          ./flutter/bin/flutter clean
      
      - name: Build .app
        run: |
          ./flutter/bin/flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lumen.ipa Payload/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa