name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Clean and prepare
        run: |
          flutter clean
          rm -rf ios
          rm -rf build
          flutter pub get
      
      - name: Create iOS project
        run: |
          flutter create --platforms=ios --org=com.lumen .
          
          # Удаляем проблемную директорию Swift packages
          rm -rf ios/Flutter/ephemeral/Packages
          mkdir -p ios/Flutter/ephemeral/Packages
          
          # Создаем фиктивный файл, чтобы Xcode не ругался
          echo "// Dummy file to satisfy Xcode" > ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage.swift
      
      - name: Create proper Podfile
        run: |
          cat > ios/Podfile << 'EOF'
          platform :ios, '13.0'
          
          # Отключаем Swift Package Manager
          $iOSVersion = '13.0'
          
          target 'Runner' do
            use_frameworks! :linkage => :static
            use_modular_headers!
            
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['ENABLE_BITCODE'] = 'NO'
              end
            end
          end
          EOF
      
      - name: Install pods
        run: |
          cd ios
          pod deintegrate || true
          pod cache clean --all || true
          pod install --repo-update
          cd ..
      
      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
          
          # Создаем IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../lumen.ipa Payload/
          cd ../../..
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa