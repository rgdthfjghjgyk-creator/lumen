name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      
      - name: Build unsigned IPA
        run: |
          # Очистка
          flutter clean
          rm -rf ios
          
          # Подготовка
          flutter pub get
          flutter create --platforms=ios --org=com.lumen .
          
          # Установка подов
          cd ios
          pod install --repo-update
          cd ..
          
          # Сборка для устройства (без подписи)
          flutter build ios --release --no-codesign
          
          # Создание IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../lumen-unsigned.ipa Payload/
          cd ../../..
          
          # Также сохраняем .app для AltStore
          zip -r lumen-app.zip build/ios/iphoneos/Runner.app
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumen-unsigned
          path: |
            lumen-unsigned.ipa
            lumen-app.zip