name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      
      - name: Build
        run: |
          # Очищаем все
          flutter clean
          rm -rf ios
          
          # Пересоздаем
          flutter pub get
          flutter create --platforms=ios .
          
          # Билдим без pod install (Flutter сделает это сам)
          flutter build ios --release --no-codesign
          
          # Пакуем
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lumen.ipa Payload/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa