name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      
      - name: Fix Swift Package issue
        run: |
          flutter clean
          rm -rf ios
          flutter pub get
          flutter create --platforms=ios --org=com.lumen .
          rm -rf ios/Flutter/ephemeral/Packages
          mkdir -p ios/Flutter/ephemeral/Packages
          touch ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage.swift
      
      - name: Build IPA
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../../../lumen.ipa Payload/
          cd ../../..
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lumen.ipa
          path: lumen.ipa