name: Build iOS App for Device

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Setup iOS signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Создаем ключницу
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          
          # Импортируем сертификат
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          
          # Импортируем provisioning profile
          echo $BUILD_PROVISION_PROFILE_BASE64 | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
          # Очищаем
          rm certificate.p12 profile.mobileprovision
      
      - name: Build iOS for Device
        run: |
          flutter clean
          rm -rf ios
          flutter pub get
          flutter create --platforms=ios --org=com.lumen .
          
          # Обновляем Bundle ID в Xcode проекте
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.yourcompany.lumen" ios/Runner/Info.plist
          
          # Собираем для устройства
          flutter build ios --release --no-codesign
          
          # Создаем IPA
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lumen-device.ipa Payload/
      
      - name: Upload IPA for Device
        uses: actions/upload-artifact@v4
        with:
          name: lumen-device.ipa
          path: lumen-device.ipa