name: Build iOS App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4
      
      # 2. Setup Java (required for some Flutter dependencies)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # 3. Setup Flutter with specific version to avoid ARM64 issues
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'  # Используем конкретную стабильную версию
          channel: 'stable'
          architecture: x64  # Явно указываем x64 архитектуру
          cache: true  # Включаем кэширование для ускорения
      
      # 4. Verify Flutter installation
      - name: Verify Flutter setup
        run: |
          flutter --version
          flutter doctor -v
      
      # 5. Cache Flutter dependencies
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/
            .dart_tool/
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
      
      # 6. Install dependencies
      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get
      
      # 7. Run code analysis
      - name: Analyze code
        run: flutter analyze
      
      # 8. Run tests
      - name: Run tests
        run: flutter test
      
      # 9. Install CocoaPods dependencies
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..
      
      # 10. Build iOS app without signing
      - name: Build iOS app
        run: |
          flutter build ios --release --no-codesign
      
      # 11. Create IPA file
      - name: Create IPA bundle
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lumen-${{ github.run_number }}.ipa Payload/
          rm -rf Payload
      
      # 12. Create .app bundle for debugging
      - name: Create APP bundle
        run: |
          zip -r lumen-${{ github.run_number }}.app.zip build/ios/iphoneos/Runner.app
      
      # 13. Upload IPA artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ github.run_number }}.ipa
          path: lumen-${{ github.run_number }}.ipa
          retention-days: 30
      
      # 14. Upload APP bundle for debugging
      - name: Upload APP bundle
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ github.run_number }}.app
          path: lumen-${{ github.run_number }}.app.zip
          retention-days: 7
      
      # 15. Upload build logs
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            ios/build/
          retention-days: 7

  # Optional: Create release on tag
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: lumen-${{ github.run_number }}.ipa
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/lumen-*.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Lumen v${{ github.ref_name }}
          body: |
            ## 🎉 Lumen ${{ github.ref_name }}
            
            ### Что нового:
            - Автоматическая сборка через GitHub Actions
            - Оптимизировано для iOS
            - Исправлены баги
            
            ### Установка:
            1. Скачайте файл lumen.ipa
            2. Используйте AltStore, SideStore или другие инструменты для установки
            3. Наслаждайтесь приложением!