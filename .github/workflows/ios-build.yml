name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      
      - name: Build iOS app
        run: |
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign
          
          # Создаем IPA из .app
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lumen.ipa Payload/
          
          # Также сохраняем .app для отладки
          zip -r Runner.app.zip build/ios/iphoneos/Runner.app
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lumen-ipa
          path: |
            lumen.ipa
            Runner.app.zip
          retention-days: 30