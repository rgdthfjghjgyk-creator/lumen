name: lumen
description: "Будильник для iOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Базовые пакеты
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  flutter_local_notifications: ^17.0.0
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0  # Понизили с 5.0.0 до 4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/