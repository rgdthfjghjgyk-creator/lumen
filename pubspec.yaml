name: lumen
description: "Современный будильник для iOS с расширенными функциями"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"  # Изменил с 3.4.0 на 3.3.0

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  
  # Уведомления и фон
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.1
  background_fetch: ^1.2.1
  
  # Аудио
  audioplayers: ^6.0.0
  assets_audio_player: ^3.1.1
  
  # Хранение
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # Время и дата
  intl: ^0.19.0
  timezone: ^0.9.2
  flutter_timezone: ^1.0.9
  
  # UI компоненты
  time_picker_sheet: ^1.0.4
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  
  # Анимации
  lottie: ^3.1.0
  animate_do: ^3.3.4
  
  # Разрешения и сенсоры
  permission_handler: ^11.3.0
  vibration: ^1.8.4
  sensors_plus: ^5.0.1
  
  # Аналитика и ошибки
  sentry_flutter: ^8.3.0
  
  # Утилиты
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/animations/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21